<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习统计 - 智能题库</title>
    <style id="theme-vars">
:root {
  /* === Brand Primary (Indigo) === */
  --brand: #4F46E5;
  --brand-light: #818CF8;
  --brand-dark: #3730A3;
  --brand-8: rgba(79, 70, 229, 0.08);
  --brand-15: rgba(79, 70, 229, 0.15);
  --brand-ink: #FFFFFF;

  /* === Neutral Scale === */
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;
  --ink: #0F172A;
  --ink-2: #64748B;
  --ink-3: #94A3B8;
  --line: #E2E8F0;

  /* === State Colors === */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error: #DC2626;
  --state-info: #2563EB;

  /* === Semantic Aliases === */
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-ink);
  --color-muted: var(--surface-2);
  --color-muted-foreground: var(--ink-2);
  --color-border: var(--line);
  --color-input: var(--line);
  --color-ring: var(--brand);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* === Shadow === */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);

  /* === Typography === */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  /* === Liquid Glass Effect === */
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-blur: 20px;
  --glass-shadow: 0 -2px 16px rgba(15, 23, 42, 0.08);
}

/* Dark Mode */
.dark {
  --bg: #0B0F1A;
  --surface: #141926;
  --surface-2: #1E2536;
  --surface-3: #2A3348;
  --ink: #F1F5F9;
  --ink-2: #94A3B8;
  --ink-3: #64748B;
  --line: #2A3348;
  --glass-bg: rgba(20, 25, 38, 0.72);
  --glass-border: rgba(42, 51, 72, 0.5);
  --glass-shadow: 0 -2px 16px rgba(0, 0, 0, 0.24);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-input: var(--color-input);
    --color-ring: var(--color-ring);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-background { color: var(--color-background); }
      .border-background { border-color: var(--color-background); }
      .ring-background { --tw-ring-color: var(--color-background); }
      .bg-foreground { background-color: var(--color-foreground); }
      .text-foreground { color: var(--color-foreground); }
      .border-foreground { border-color: var(--color-foreground); }
      .ring-foreground { --tw-ring-color: var(--color-foreground); }
      .bg-card { background-color: var(--color-card); }
      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }
      .ring-card { --tw-ring-color: var(--color-card); }
      .bg-card-foreground { background-color: var(--color-card-foreground); }
      .text-card-foreground { color: var(--color-card-foreground); }
      .border-card-foreground { border-color: var(--color-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--color-card-foreground); }
      .bg-popover { background-color: var(--color-popover); }
      .text-popover { color: var(--color-popover); }
      .border-popover { border-color: var(--color-popover); }
      .ring-popover { --tw-ring-color: var(--color-popover); }
      .bg-popover-foreground { background-color: var(--color-popover-foreground); }
      .text-popover-foreground { color: var(--color-popover-foreground); }
      .border-popover-foreground { border-color: var(--color-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--color-popover-foreground); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-primary-foreground { background-color: var(--color-primary-foreground); }
      .text-primary-foreground { color: var(--color-primary-foreground); }
      .border-primary-foreground { border-color: var(--color-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--color-primary-foreground); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
      .bg-input { background-color: var(--color-input); }
      .text-input { color: var(--color-input); }
      .border-input { border-color: var(--color-input); }
      .ring-input { --tw-ring-color: var(--color-input); }
      .bg-ring { background-color: var(--color-ring); }
      .text-ring { color: var(--color-ring); }
      .border-ring { border-color: var(--color-ring); }
      .ring-ring { --tw-ring-color: var(--color-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

  <!-- Shell shared styles -->
  <style>
    /* ── Project Shell — shared layout & bottom nav ── */
    #app-shell {
      min-height: 100vh;
      padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 16px);
    }

    /* ── Bottom Navigation Bar (Liquid Glass) ── */
    .bottom-nav-bar {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 28rem;
      height: 56px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      gap: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 1000;
    }

    .bottom-nav-bar a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--ink-3);
      font-weight: 400;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
    }

    .bottom-nav-bar a .nav-icon {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .bottom-nav-bar a .nav-label {
      font-size: 11px;
      line-height: 1;
    }

    .bottom-nav-bar a[data-active="true"] {
      color: var(--brand);
      font-weight: 600;
    }
  </style>

  <div id="app-shell">
    <!-- Page Content -->
    <div class="px-4 pt-12 pb-8">

      <!-- Header -->
      <div class="mb-6">
        <h1 style="font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.3;">学习统计</h1>
        <p style="font-size: 14px; color: var(--ink-3); margin-top: 4px;">查看你的学习数据</p>
      </div>

      <!-- Period Selector -->
      <div class="flex gap-2 mb-6">
        <button class="period-pill">本周</button>
        <button class="period-pill active">本月</button>
        <button class="period-pill">全部</button>
      </div>

      <!-- Stats Summary -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <!-- 做题量 -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 12px; text-align: center;">
          <p style="font-size: 11px; color: var(--ink-3); margin-bottom: 4px;">做题量</p>
          <p style="font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1.2;">286</p>
          <p style="font-size: 10px; color: var(--state-success); margin-top: 2px;">较上周 +12%</p>
        </div>
        <!-- 正确率 -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 12px; text-align: center;">
          <p style="font-size: 11px; color: var(--ink-3); margin-bottom: 4px;">正确率</p>
          <p style="font-size: 22px; font-weight: 700; color: var(--state-success); line-height: 1.2;">87%</p>
          <p style="font-size: 10px; color: var(--state-success); margin-top: 2px;">较上周 +3%</p>
        </div>
        <!-- 学习时长 -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 12px; text-align: center;">
          <p style="font-size: 11px; color: var(--ink-3); margin-bottom: 4px;">学习时长</p>
          <p style="font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1.2;">18.5h</p>
          <p style="font-size: 10px; color: var(--state-success); margin-top: 2px;">较上周 +2.1h</p>
        </div>
      </div>

      <!-- Learning Curve Chart -->
      <div style="background: var(--surface); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px;">
        <h2 style="font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px;">做题量趋势</h2>
        <div class="chart-wrapper">
          <canvas id="trendChart" height="200"></canvas>
        </div>
      </div>

      <!-- Accuracy Chart -->
      <div style="background: var(--surface); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px;">
        <h2 style="font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px;">正确率趋势</h2>
        <div class="chart-wrapper">
          <canvas id="accuracyChart" height="200"></canvas>
        </div>
      </div>

      <!-- Subject Distribution -->
      <div style="background: var(--surface); border-radius: var(--radius-lg); padding: 16px;">
        <h2 style="font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px;">科目分布</h2>
        <div class="chart-wrapper" style="height: 180px;">
          <canvas id="subjectChart" height="200"></canvas>
        </div>
        <!-- Legend -->
        <div class="flex justify-center gap-4 mt-3">
          <div class="flex items-center gap-1">
            <span class="legend-dot" style="background: #4F46E5;"></span>
            <span style="font-size: 12px; color: var(--ink-2);">数学 40%</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="legend-dot" style="background: #818CF8;"></span>
            <span style="font-size: 12px; color: var(--ink-2);">英语 25%</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="legend-dot" style="background: rgba(79, 70, 229, 0.15);"></span>
            <span style="font-size: 12px; color: var(--ink-2);">物理 20%</span>
          </div>
          <div class="flex items-center gap-1">
            <span class="legend-dot" style="background: #E2E8F0;"></span>
            <span style="font-size: 12px; color: var(--ink-2);">化学 15%</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav-bar">
    <a href="home.html" data-nav-key="home" data-mobile-nav="global" data-dom-id="nav-home">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label whitespace-nowrap max-w-full truncate">首页</span>
    </a>
    <a href="question-bank.html" data-nav-key="question-bank" data-mobile-nav="global" data-dom-id="nav-question-bank">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
      <span class="nav-label whitespace-nowrap max-w-full truncate">题库</span>
    </a>
    <a href="ai-chat.html" data-nav-key="ai-chat" data-mobile-nav="global" data-dom-id="nav-ai-chat">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label whitespace-nowrap max-w-full truncate">AI问答</span>
    </a>
    <a href="practice-setup.html" data-nav-key="random-practice" data-mobile-nav="global" data-dom-id="nav-random-practice">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      <span class="nav-label whitespace-nowrap max-w-full truncate">练习</span>
    </a>
    <a href="statistics.html" data-nav-key="statistics" data-mobile-nav="global" data-active="true">
      <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="nav-label whitespace-nowrap max-w-full truncate">我的</span>
    </a>
  </nav>

  <!-- Chart.js Initialization Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // ── Learning Curve (Line Chart) ──
      const trendCtx = document.getElementById('trendChart');
      if (trendCtx) {
        new Chart(trendCtx, {
          type: 'line',
          data: {
            labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
            datasets: [{
              label: '做题量',
              data: [32, 45, 28, 52, 38, 55, 42],
              borderColor: '#4F46E5',
              backgroundColor: 'rgba(79, 70, 229, 0.08)',
              fill: true,
              tension: 0.4,
              pointBackgroundColor: '#4F46E5',
              pointRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: '#E2E8F0' }, ticks: { color: '#94A3B8', font: { size: 11 } } },
              y: { grid: { color: '#E2E8F0' }, ticks: { color: '#94A3B8', font: { size: 11 } }, beginAtZero: true }
            }
          }
        });
      }

      // ── Accuracy Trend (Bar Chart) ──
      const accuracyCtx = document.getElementById('accuracyChart');
      if (accuracyCtx) {
        new Chart(accuracyCtx, {
          type: 'bar',
          data: {
            labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
            datasets: [{
              label: '正确率',
              data: [85, 92, 78, 95, 88, 91, 87],
              backgroundColor: '#4F46E5',
              borderRadius: 6,
              maxBarThickness: 32
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#94A3B8', font: { size: 11 } } },
              y: { grid: { color: '#E2E8F0' }, ticks: { color: '#94A3B8', font: { size: 11 }, callback: function(value) { return value + '%'; } }, beginAtZero: true, max: 100 }
            }
          }
        });
      }

      // ── Subject Distribution (Doughnut Chart) ──
      const subjectCtx = document.getElementById('subjectChart');
      if (subjectCtx) {
        new Chart(subjectCtx, {
          type: 'doughnut',
          data: {
            labels: ['数学', '英语', '物理', '化学'],
            datasets: [{
              data: [40, 25, 20, 15],
              backgroundColor: ['#4F46E5', '#818CF8', 'rgba(79, 70, 229, 0.15)', '#E2E8F0'],
              borderWidth: 0,
              cutout: '62%'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } }
          }
        });
      }

    });
  </script>


    <style>
    /* ── Theme vars (inline fallback) ── */
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-2: #F1F5F9;
      --surface-3: #E2E8F0;
      --ink: #0F172A;
      --ink-2: #475569;
      --ink-3: #94A3B8;
      --brand: #4F46E5;
      --brand-light: #818CF8;
      --brand-15: rgba(79, 70, 229, 0.15);
      --brand-8: rgba(79, 70, 229, 0.08);
      --state-success: #10B981;
      --line: #E2E8F0;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-blur: 20px;
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 -4px 30px rgba(0, 0, 0, 0.06);
    }

    /* Semantic token fallback */
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @theme inline {
      --color-brand: var(--brand);
      --color-surface: var(--surface);
      --color-surface-2: var(--surface-2);
    }

    /* Chart container explicit height */
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
    }

    /* Period pill */
    .period-pill {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      outline: none;
      font-family: var(--font-sans);
    }

    .period-pill.active {
      background: var(--brand);
      color: #FFFFFF;
    }

    .period-pill:not(.active) {
      background: var(--surface-2);
      color: var(--ink-3);
    }

    /* Legend dot */
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
  </style>
</body>
</html>
