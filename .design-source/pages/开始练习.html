<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始练习 - 智能题库</title>
    <style id="theme-vars">
:root {
  /* === Brand Primary (Indigo) === */
  --brand: #4F46E5;
  --brand-light: #818CF8;
  --brand-dark: #3730A3;
  --brand-8: rgba(79, 70, 229, 0.08);
  --brand-15: rgba(79, 70, 229, 0.15);
  --brand-ink: #FFFFFF;

  /* === Neutral Scale === */
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;
  --ink: #0F172A;
  --ink-2: #64748B;
  --ink-3: #94A3B8;
  --line: #E2E8F0;

  /* === State Colors === */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error: #DC2626;
  --state-info: #2563EB;

  /* === Semantic Aliases === */
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-ink);
  --color-muted: var(--surface-2);
  --color-muted-foreground: var(--ink-2);
  --color-border: var(--line);
  --color-input: var(--line);
  --color-ring: var(--brand);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* === Shadow === */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);

  /* === Typography === */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  /* === Liquid Glass Effect === */
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-blur: 20px;
  --glass-shadow: 0 -2px 16px rgba(15, 23, 42, 0.08);
}

/* Dark Mode */
.dark {
  --bg: #0B0F1A;
  --surface: #141926;
  --surface-2: #1E2536;
  --surface-3: #2A3348;
  --ink: #F1F5F9;
  --ink-2: #94A3B8;
  --ink-3: #64748B;
  --line: #2A3348;
  --glass-bg: rgba(20, 25, 38, 0.72);
  --glass-border: rgba(42, 51, 72, 0.5);
  --glass-shadow: 0 -2px 16px rgba(0, 0, 0, 0.24);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-input: var(--color-input);
    --color-ring: var(--color-ring);
    --radius-sm: var(--color-radius-sm);
    --radius-md: var(--color-radius-md);
    --radius-lg: var(--color-radius-lg);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }

      .bg-primary { background-color: var(--color-primary); }

      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-primary-foreground { background-color: var(--color-primary-foreground); }
      .text-primary-foreground { color: var(--color-primary-foreground); }
      .border-primary-foreground { border-color: var(--color-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--color-primary-foreground); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }

      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
      .bg-input { background-color: var(--color-input); }

      .bg-ring { background-color: var(--color-ring); }

      .no-scrollbar::-webkit-scrollbar { display: none; }

<body style="background: var(--bg); font-family: var(--font-sans); margin: 0;">

<div id="app-shell">

  <!-- ═══════ Top Bar ═══════ -->
  <div class="px-4 pt-12 flex items-center justify-between">
    <button data-dom-id="btn-back-home" style="width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 style="font-size: 17px; font-weight: 600; color: var(--ink); margin: 0;">开始练习</h1>
    <div style="width: 36px;"></div>
  </div>

  <!-- ═══════ Subject Selection ═══════ -->
  <div class="px-4 mt-6">
    <div class="flex items-center gap-2 mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      <h2 style="font-size: 16px; font-weight: 600; color: var(--ink); margin: 0;">选择科目</h2>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <!-- Subject: 高中数学 (SELECTED) -->
      <button data-dom-id="subject-math" class="subject-card selected" style="background: var(--brand-8); border: 2px solid var(--brand); border-radius: var(--radius-lg); padding: 16px 12px; cursor: pointer; transition: all 0.2s ease; text-align: left; font-family: var(--font-sans);">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: var(--brand);">高中数学</div>
        <div style="font-size: 12px; color: var(--ink-3); margin-top: 2px;">328 题</div>
      </button>

      <!-- Subject: 英语语法 -->
      <button data-dom-id="subject-english" class="subject-card" style="background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); padding: 16px 12px; cursor: pointer; transition: all 0.2s ease; text-align: left; font-family: var(--font-sans);">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--surface-2); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: var(--ink);">英语语法</div>
        <div style="font-size: 12px; color: var(--ink-3); margin-top: 2px;">256 题</div>
      </button>

      <!-- Subject: 物理力学 -->
      <button data-dom-id="subject-physics" class="subject-card" style="background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); padding: 16px 12px; cursor: pointer; transition: all 0.2s ease; text-align: left; font-family: var(--font-sans);">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--surface-2); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-7.07-3.93 4.24-4.24m5.66-5.66 4.24-4.24M1 12h6m6 0h6m-3.93 7.07-4.24-4.24M9.17 7.83 4.93 3.59"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: var(--ink);">物理力学</div>
        <div style="font-size: 12px; color: var(--ink-3); margin-top: 2px;">189 题</div>
      </button>

      <!-- Subject: 化学反应 -->
      <button data-dom-id="subject-chemistry" class="subject-card" style="background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius-lg); padding: 16px 12px; cursor: pointer; transition: all 0.2s ease; text-align: left; font-family: var(--font-sans);">
        <div style="width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--surface-2); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 9V3h4v6"/><path d="M5 9h14"/><path d="M6 3h12v4a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V3"/><path d="M12 9v12"/><path d="M5 21h14"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: var(--ink);">化学反应</div>
        <div style="font-size: 12px; color: var(--ink-3); margin-top: 2px;">142 题</div>
      </button>
    </div>
  </div>

  <!-- ═══════ Difficulty Selection ═══════ -->
  <div class="px-4 mt-6">
    <div class="flex items-center gap-2 mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><signal><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></signal></svg>
      <h2 style="font-size: 16px; font-weight: 600; color: var(--ink); margin: 0;">选择难度</h2>
    </div>

    <div class="flex gap-2">
      <!-- Difficulty: 全部 (SELECTED) -->
      <button data-dom-id="diff-all" class="diff-btn selected" style="flex: 1; padding: 12px 8px; border-radius: var(--radius-md); background: var(--brand); border: none; cursor: pointer; font-family: var(--font-sans); transition: all 0.2s ease;">
        <div style="font-size: 14px; font-weight: 600; color: #FFFFFF; text-align: center;">全部</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.7); text-align: center; margin-top: 2px;">915 题</div>
      </button>

      <!-- Difficulty: 简单 -->
      <button data-dom-id="diff-easy" class="diff-btn" style="flex: 1; padding: 12px 8px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-family: var(--font-sans); transition: all 0.2s ease;">
        <div style="font-size: 14px; font-weight: 500; color: var(--ink); text-align: center;">简单</div>
        <div style="font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 2px;">340 题</div>
      </button>

      <!-- Difficulty: 中等 -->
      <button data-dom-id="diff-medium" class="diff-btn" style="flex: 1; padding: 12px 8px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-family: var(--font-sans); transition: all 0.2s ease;">
        <div style="font-size: 14px; font-weight: 500; color: var(--ink); text-align: center;">中等</div>
        <div style="font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 2px;">410 题</div>
      </button>

      <!-- Difficulty: 困难 -->
      <button data-dom-id="diff-hard" class="diff-btn" style="flex: 1; padding: 12px 8px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-family: var(--font-sans); transition: all 0.2s ease;">
        <div style="font-size: 14px; font-weight: 500; color: var(--ink); text-align: center;">困难</div>
        <div style="font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 2px;">165 题</div>
      </button>
    </div>
  </div>

  <!-- ═══════ Settings Row ═══════ -->
  <div class="px-4 mt-6">
    <div class="flex items-center gap-2 mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <h2 style="font-size: 16px; font-weight: 600; color: var(--ink); margin: 0;">练习设置</h2>
    </div>

    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 0;">
      <!-- Number of questions -->
      <div class="flex items-center justify-between" style="padding: 16px 20px; border-bottom: 1px solid var(--line);">
        <span style="font-size: 14px; color: var(--ink);">每轮题数</span>
        <div class="flex items-center gap-3">
          <button class="qty-btn" style="width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--ink-2); font-family: var(--font-sans);">-</button>
          <span style="font-size: 15px; font-weight: 600; color: var(--ink); min-width: 24px; text-align: center;">10</span>
          <button class="qty-btn" style="width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--ink-2); font-family: var(--font-sans);">+</button>
        </div>
      </div>

      <!-- Timer toggle -->
      <div class="flex items-center justify-between" style="padding: 16px 20px;">
        <span style="font-size: 14px; color: var(--ink);">计时模式</span>
        <div style="width: 44px; height: 26px; border-radius: 13px; background: var(--brand); padding: 2px; cursor: pointer; transition: background 0.2s ease; position: relative;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; position: absolute; top: 2px; right: 2px; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.15);"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════ Start Button ═══════ -->
  <div class="px-4 mt-6 mb-6">
    <button data-dom-id="cta-start-practice" style="width: 100%; padding: 16px; background: var(--brand); color: #FFFFFF; border: none; border-radius: var(--radius-lg); font-size: 16px; font-weight: 600; font-family: var(--font-sans); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 14px -3px rgba(79, 70, 229, 0.4); transition: transform 0.15s ease;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      开始练习
    </button>
  </div>

  <!-- SLOT: bottom-nav -->

</div>
