    <style id="theme-vars">
:root {
  /* === Brand Primary (Indigo) === */
  --brand: #4F46E5;
  --brand-light: #818CF8;
  --brand-dark: #3730A3;
  --brand-8: rgba(79, 70, 229, 0.08);
  --brand-15: rgba(79, 70, 229, 0.15);
  --brand-ink: #FFFFFF;

  /* === Neutral Scale === */
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;
  --ink: #0F172A;
  --ink-2: #64748B;
  --ink-3: #94A3B8;
  --line: #E2E8F0;

  /* === State Colors === */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error: #DC2626;
  --state-info: #2563EB;

  /* === Semantic Aliases === */
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-ink);
  --color-muted: var(--surface-2);
  --color-muted-foreground: var(--ink-2);
  --color-border: var(--line);
  --color-input: var(--line);
  --color-ring: var(--brand);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* === Shadow === */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);

  /* === Typography === */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  /* === Liquid Glass Effect === */
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-blur: 20px;
  --glass-shadow: 0 -2px 16px rgba(15, 23, 42, 0.08);
}

/* Dark Mode */
.dark {
  --bg: #0B0F1A;
  --surface: #141926;
  --surface-2: #1E2536;
  --surface-3: #2A3348;
  --ink: #F1F5F9;
  --ink-2: #94A3B8;
  --ink-3: #64748B;
  --line: #2A3348;
  --glass-bg: rgba(20, 25, 38, 0.72);
  --glass-border: rgba(42, 51, 72, 0.5);
  --glass-shadow: 0 -2px 16px rgba(0, 0, 0, 0.24);
}

    </style>

<body>
  <!-- Shell shared styles -->
  <style>
    /* ── Project Shell — shared layout & bottom nav ── */
    #app-shell {
      min-height: 100vh;
      padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 16px);
    }

    /* ── Bottom Navigation Bar (Liquid Glass) ── */
    .bottom-nav-bar {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 28rem;
      height: 56px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      gap: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px 20px 0 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 1000;
    }

    .bottom-nav-bar a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--ink-3);
      font-weight: 400;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
    }

    .bottom-nav-bar a .nav-icon {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .bottom-nav-bar a .nav-label {
      font-size: 11px;
      line-height: 1;
    }

    .bottom-nav-bar a[data-active="true"] {
      color: var(--brand);
      font-weight: 600;
    }
  </style>

  <div id="app-shell">
    <div style="padding: 48px 16px 32px; max-width: 28rem; margin: 0 auto;">

      <!-- Header -->
      <div style="margin-bottom: 20px;">
        <h1 style="font-size: 20px; font-weight: 600; margin: 0 0 4px; color: var(--ink); line-height: 1.3;">每日目标</h1>
        <p style="font-size: 14px; color: var(--ink-3); margin: 0;">2024年7月25日 周四</p>
      </div>

      <!-- Main Goal Card -->
      <div style="background: var(--brand-8); border: 1px solid var(--brand-15); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; text-align: center;">
        <p style="font-size: 16px; font-weight: 600; margin: 0 0 20px; color: var(--ink);">今日目标</p>

        <div style="display: flex; flex-direction: column; align-items: center;">
          <!-- Progress Ring -->
          <div class="progress-ring">
            <div class="ring-content">
              <div style="display: flex; align-items: baseline; justify-content: center; gap: 2px;">
                <span style="font-size: 36px; font-weight: 700; color: var(--brand); line-height: 1;">20</span>
                <span style="font-size: 14px; color: var(--ink-3); font-weight: 400;">题</span>
              </div>
            </div>
          </div>

          <p style="font-size: 14px; color: var(--ink-2); margin: 12px 0 4px;">已完成 13 题</p>
          <p style="font-size: 13px; color: var(--ink-3); margin: 0;">再坚持一下，还差 7 题！</p>
        </div>
      </div>

      <!-- Goal Checklist -->
      <div style="margin-bottom: 20px;">
        <h2 style="font-size: 16px; font-weight: 600; margin: 0 0 12px; color: var(--ink);">学习计划</h2>

        <!-- Item 1: Checked -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div style="flex: 1; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; color: var(--ink); text-decoration: line-through; color: var(--ink-3);">完成数学函数专题练习</span>
            <span style="font-size: 13px; color: var(--ink-3); white-space: nowrap; margin-left: 8px;">15/20 题</span>
          </div>
        </div>

        <!-- Item 2: Checked -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div style="flex: 1; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; color: var(--ink-3); text-decoration: line-through;">复习英语定语从句</span>
            <span style="font-size: 13px; color: var(--ink-3); white-space: nowrap; margin-left: 8px;">10/10 题</span>
          </div>
        </div>

        <!-- Item 3: Unchecked -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          <div style="flex: 1; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; color: var(--ink);">物理力学巩固</span>
            <span style="font-size: 13px; color: var(--ink-3); white-space: nowrap; margin-left: 8px;">0/15 题</span>
          </div>
        </div>

        <!-- Item 4: Unchecked -->
        <div style="background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          <div style="flex: 1; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; color: var(--ink);">化学方程式记忆</span>
            <span style="font-size: 13px; color: var(--ink-3); white-space: nowrap; margin-left: 8px;">0/10 题</span>
          </div>
        </div>
      </div>

      <!-- Streak Card -->
      <div style="margin-bottom: 20px;">
        <h2 style="font-size: 16px; font-weight: 600; margin: 0 0 12px; color: var(--ink);">打卡记录</h2>

        <div style="background: var(--surface); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <!-- 7-day week view -->
          <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
            <!-- Mon -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot filled">一</div>
            </div>
            <!-- Tue -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot filled">二</div>
            </div>
            <!-- Wed -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot filled">三</div>
            </div>
            <!-- Thu (current) -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot current">四</div>
            </div>
            <!-- Fri -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot empty">五</div>
            </div>
            <!-- Sat -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot empty">六</div>
            </div>
            <!-- Sun -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
              <div class="streak-dot empty">日</div>
            </div>
          </div>

          <!-- Streak message -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
            <span style="font-size: 15px; font-weight: 600; color: var(--brand);">连续打卡 15 天</span>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div style="display: flex; gap: 12px; margin-bottom: 20px;">
        <button data-dom-id="cta-start-practice" style="flex: 1; padding: 14px 0; background: var(--brand); color: #ffffff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; font-family: var(--font-sans); cursor: pointer; -webkit-tap-highlight-color: transparent;">
          开始今日练习
        </button>
        <button data-dom-id="cta-adjust-goal" style="flex: 1; padding: 14px 0; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); font-size: 15px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; -webkit-tap-highlight-color: transparent;">
          调整目标
        </button>
      </div>

    </div>
  </div>

    <style>
    /* ── Theme Variables ── */
    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --surface-2: #e8e8e8;
      --ink: #1a1a1a;
      --ink-2: #666666;
      --ink-3: #999999;
      --brand: #4f6ef7;
      --brand-8: #eef1fe;
      --brand-15: #d6dcfe;
      --line: #e0e0e0;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-blur: 20px;
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-shadow: 0 -1px 12px rgba(0, 0, 0, 0.06);
    }

    /* ── Semantic Token Fallback ── */
    :root {
      --color-bg: var(--bg);
      --color-surface: var(--surface);
      --color-surface-2: var(--surface-2);
      --color-ink: var(--ink);
      --color-ink-2: var(--ink-2);
      --color-ink-3: var(--ink-3);
      --color-brand: var(--brand);
      --color-brand-8: var(--brand-8);
      --color-brand-15: var(--brand-15);
      --color-line: var(--line);
      --color-success: #22c55e;
    }

    /* ── Tailwind @theme Inline ── */
    @theme {
      --color-brand: var(--brand);
      --color-brand-8: var(--brand-8);
      --color-brand-15: var(--brand-15);
      --color-surface: var(--surface);
      --color-surface-2: var(--surface-2);
      --color-ink: var(--ink);
      --color-ink-2: var(--ink-2);
      --color-ink-3: var(--ink-3);
      --color-line: var(--line);
