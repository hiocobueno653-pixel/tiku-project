<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>

    <style id="theme-vars">
:root {
  /* === Brand Primary (Indigo) === */
  --brand: #4F46E5;
  --brand-light: #818CF8;
  --brand-dark: #3730A3;
  --brand-8: rgba(79, 70, 229, 0.08);
  --brand-15: rgba(79, 70, 229, 0.15);
  --brand-ink: #FFFFFF;

  /* === Neutral Scale === */
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;
  --ink: #0F172A;
  --ink-2: #64748B;
  --ink-3: #94A3B8;
  --line: #E2E8F0;

  /* === State Colors === */
  --state-success: #16A34A;
  --state-warning: #D97706;
  --state-error: #DC2626;
  --state-info: #2563EB;

  /* === Semantic Aliases === */
  --color-background: var(--bg);
  --color-foreground: var(--ink);
  --color-card: var(--surface);
  --color-card-foreground: var(--ink);
  --color-popover: var(--surface);
  --color-popover-foreground: var(--ink);
  --color-primary: var(--brand);
  --color-primary-foreground: var(--brand-ink);
  --color-muted: var(--surface-2);
  --color-muted-foreground: var(--ink-2);
  --color-border: var(--line);
  --color-input: var(--line);
  --color-ring: var(--brand);
  --color-radius-sm: var(--radius-sm);
  --color-radius-md: var(--radius-md);
  --color-radius-lg: var(--radius-lg);

  /* === Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* === Spacing === */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 80px;

  /* === Shadow === */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);

  /* === Typography === */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

  /* === Liquid Glass Effect === */
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.5);
  --glass-blur: 20px;
  --glass-shadow: 0 -2px 16px rgba(15, 23, 42, 0.08);
}

/* Dark Mode */
.dark {
  --bg: #0B0F1A;
  --surface: #141926;
  --surface-2: #1E2536;
  --surface-3: #2A3348;
  --ink: #F1F5F9;
  --ink-2: #94A3B8;
  --ink-3: #64748B;
  --line: #2A3348;
  --glass-bg: rgba(20, 25, 38, 0.72);
  --glass-border: rgba(42, 51, 72, 0.5);
  --glass-shadow: 0 -2px 16px rgba(0, 0, 0, 0.24);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

    <style type="text/tailwindcss">

<body style="background: var(--bg); font-family: var(--font-sans); margin: 0;">

<div id="app-shell">

  <!-- ═══════ Header / Greeting ═══════ -->
  <div class="px-4 pt-12 flex items-center justify-between">
    <div>
      <h1 style="font-size: 26px; font-weight: 700; color: var(--ink); margin: 0; line-height: 1.3;">早上好</h1>
      <p style="font-size: 14px; color: var(--ink-2); margin: 4px 0 0;">今天也要加油哦</p>
    </div>
    <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--indigo-8); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="color: #fff; font-size: 18px; font-weight: 600;">我</span>
    </div>
  </div>

  <!-- ═══════ Today's Progress Card ═══════ -->
  <div class="px-4 mt-6">
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px;">
      <div class="flex items-center justify-between mb-3">
        <h3 style="font-size: 20px; font-weight: 600; color: var(--ink); margin: 0;">今日进度</h3>
        <button data-dom-id="cta-practice-setup" style="background: var(--brand); color: #fff; border: none; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; white-space: nowrap;">继续学习</button>
      </div>
      <!-- Progress bar -->
      <div style="width: 100%; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden;">
        <div style="width: 65%; height: 100%; background: var(--brand); border-radius: 999px; transition: width 0.4s ease;"></div>
      </div>
      <p style="font-size: 13px; color: var(--ink-2); margin: 8px 0 0;">已完成 13/20 题</p>
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span style="font-size: 13px; color: var(--ink-2);">每日目标: 20 题</span>
        </div>
        <button data-dom-id="cta-daily-goal" style="font-size: 13px; font-weight: 500; color: var(--brand); background: none; border: none; cursor: pointer; font-family: var(--font-sans); padding: 4px 8px; display: flex; align-items: center; gap: 2px;">
          设置目标
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════ Quick Stats Row ═══════ -->
  <div class="px-4 mt-6">
    <div class="grid grid-cols-3 gap-3">
      <!-- Stat: 累计做题 -->
      <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 8px; text-align: center;">
        <div style="font-size: 24px; font-weight: 700; color: var(--brand); line-height: 1.2;">1,286</div>
        <div style="font-size: 12px; color: var(--ink-2); margin-top: 4px;">累计做题</div>
      </div>
      <!-- Stat: 正确率 -->
      <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 8px; text-align: center;">
        <div style="font-size: 24px; font-weight: 700; color: var(--state-success); line-height: 1.2;">87%</div>
        <div style="font-size: 12px; color: var(--ink-2); margin-top: 4px;">正确率</div>
      </div>
      <!-- Stat: 连续打卡 -->
      <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 8px; text-align: center;">
        <div style="font-size: 24px; font-weight: 700; color: var(--brand); line-height: 1.2;">15天</div>
        <div style="font-size: 12px; color: var(--ink-2); margin-top: 4px;">连续打卡</div>
      </div>
    </div>
  </div>

  <!-- ═══════ Recent Activity Section ═══════ -->
  <div class="px-4 mt-6">
    <h2 style="font-size: 18px; font-weight: 600; color: var(--ink); margin: 0 0 12px;">最近练习</h2>

    <!-- Activity Item 1 -->
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;">
      <div style="flex: 1; min-width: 0;">
        <div class="flex items-center gap-2">
          <span style="font-size: 15px; font-weight: 500; color: var(--ink);">高中数学 - 函数与导数</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--state-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <span style="font-size: 12px; color: var(--ink-2); margin-top: 2px; display: block;">今天 14:30</span>
      </div>
      <span style="font-size: 16px; font-weight: 600; color: var(--state-success); flex-shrink: 0; margin-left: 12px;">92分</span>
    </div>

    <!-- Activity Item 2 -->
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;">
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 500; color: var(--ink);">英语语法 - 定语从句</div>
        <span style="font-size: 12px; color: var(--ink-2); margin-top: 2px; display: block;">昨天 20:15</span>
      </div>
      <span style="font-size: 16px; font-weight: 600; color: var(--brand); flex-shrink: 0; margin-left: 12px;">78分</span>
    </div>

    <!-- Activity Item 3 -->
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 0; display: flex; align-items: center; justify-content: space-between;">
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 500; color: var(--ink);">物理力学 - 牛顿定律</div>
        <span style="font-size: 12px; color: var(--ink-2); margin-top: 2px; display: block;">3天前</span>
      </div>
      <span style="font-size: 16px; font-weight: 600; color: var(--brand); flex-shrink: 0; margin-left: 12px;">85分</span>
    </div>
  </div>

  <!-- ═══════ Recommended Section ═══════ -->
  <div class="px-4 mt-6 mb-6">
    <h2 style="font-size: 18px; font-weight: 600; color: var(--ink); margin: 0 0 12px;">推荐练习</h2>

    <div class="flex gap-3 overflow-x-auto pb-2" style="-webkit-overflow-scrolling: touch;">
      <!-- Recommend Card 1 -->
      <div style="flex: 0 0 auto; width: calc(50% - 6px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; border-left: 4px solid var(--indigo-8);">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--indigo-8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span style="font-size: 15px; font-weight: 600; color: var(--ink);">薄弱知识点突破</span>
          </div>
          <p style="font-size: 12px; color: var(--ink-2); margin: 0;">针对错题智能推荐</p>
        </div>
      </div>

      <!-- Recommend Card 2 -->
      <div style="flex: 0 0 auto; width: calc(50% - 6px); background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; border-left: 4px solid var(--brand);">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span style="font-size: 15px; font-weight: 600; color: var(--ink);">每日挑战</span>
          </div>
          <p style="font-size: 12px; color: var(--ink-2); margin: 0;">限时答题挑战自我</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SLOT: bottom-nav -->

</div>

    <style>
    /* ── Project Shell — shared layout & bottom nav ── */
    #app-shell {
      min-height: 100vh;
      padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 16px);
    }

    /* ── Bottom Navigation Bar (Liquid Glass) ── */
    .bottom-nav-bar {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 28rem; /* 448px — matches max-w-md */
      height: 56px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      gap: 0;

      /* Liquid Glass */
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-top: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px 20px 0 0;

      /* Safe area */
      padding-bottom: env(safe-area-inset-bottom, 0px);

      z-index: 1000;
    }

    .bottom-nav-bar a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--ink-3);
      font-weight: 400;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s ease;
    }

    .bottom-nav-bar a .nav-icon {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .bottom-nav-bar a .nav-label {
      font-size: 11px;
      line-height: 1;
    }

    /* Active state */
    .bottom-nav-bar a[data-active="true"] {
      color: var(--brand);
      font-weight: 600;
    }
  </style>
